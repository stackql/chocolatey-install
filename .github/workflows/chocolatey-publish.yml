name: chocolatey-publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Extract version from nuspec
      id: version
      run: |
        $xml = [xml](Get-Content chocolatey/stackql.nuspec)
        $version = $xml.package.metadata.version
        Write-Output "Version in nuspec: $version"
        "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

    - name: Check whether the version is already on chocolatey.org
      id: check
      run: |
        $version = "${{ steps.version.outputs.version }}"
        $url = "https://community.chocolatey.org/api/v2/Packages(Id='stackql',Version='$version')"
        $response = Invoke-WebRequest -Uri $url -SkipHttpErrorCheck
        if ($response.StatusCode -eq 200) {
          Write-Output "stackql $version already exists on chocolatey.org, nothing to publish"
          "publish=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        } elseif ($response.StatusCode -eq 404) {
          Write-Output "stackql $version is not on chocolatey.org, publishing"
          "publish=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        } else {
          throw "Unexpected HTTP $($response.StatusCode) from $url"
        }

    - name: Create Chocolatey package
      if: steps.check.outputs.publish == 'true'
      run: |
        cd chocolatey
        choco pack

    - name: Install and test Chocolatey package
      if: steps.check.outputs.publish == 'true'
      run: choco install stackql --source "$env:GITHUB_WORKSPACE\chocolatey" -y

    - name: Push package to Chocolatey
      if: steps.check.outputs.publish == 'true'
      run: choco push "chocolatey/stackql.${{ steps.version.outputs.version }}.nupkg" --source https://push.chocolatey.org/ --api-key $env:CHOCOLATEY_API_KEY
      env:
        CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
